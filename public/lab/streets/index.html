<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <!--META-->
  <link rel="icon" type="image/x-icon" href="/images/dimazvali/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+Georgian:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LDMN4XFB42"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LDMN4XFB42');
  </script>
  <style>
    :root {
      --paper: #f4f1ea; --ink: #15120f; --muted: #56514a; --faint: #9a948b; --line: #c8c3b8; --base: #d9d3c6;
      --ok: #2f8f4e; --bad: #c9302c;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--paper); color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 13px;
      display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    header { display: flex; align-items: baseline; gap: 10px 18px; flex-wrap: wrap; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
    .logo { font-family: Oswald, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .01em; margin-right: auto; }
    .logo small { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 8px; letter-spacing: .06em; }
    /* Georgian: neither Oswald nor JetBrains Mono has the script */
    html[lang=ka] body, html[lang=ka] .logo, html[lang=ka] h1, html[lang=ka] .q, html[lang=ka] .big, html[lang=ka] .total,
    html[lang=ka] .card .street, html[lang=ka] .game h2, html[lang=ka] .reveal b, html[lang=ka] .top li em { font-family: 'Noto Sans Georgian', sans-serif; }
    html[lang=ka] .tabs button, html[lang=ka] .primary, html[lang=ka] .game h2, html[lang=ka] .group { text-transform: none; letter-spacing: 0; }
    html[lang=ka] h1 { font-size: 24px; }
    .tabs, .lang { display: flex; gap: 4px; }
    /* suggestion form in the street card */
    .sg-open { display: block; margin-top: 10px; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
    .sg-open.strong { color: var(--ink); font-weight: 700; }
    .sg-open[hidden] { display: none; }
    .sg { margin-top: 10px; display: grid; gap: 6px; }
    .sg[hidden] { display: none; }
    .sg-title { font-weight: 700; }
    .sg label { display: grid; gap: 3px; font-size: 11px; color: var(--muted); }
    .sg select, .sg textarea, .sg input { font: inherit; font-size: 12px; padding: 7px 8px; border: 1px solid var(--ink); background: #fff; color: var(--ink); width: 100%; }
    .sg textarea { resize: vertical; min-height: 64px; }
    .sg .primary { margin-top: 4px; padding: 9px; }
    .tabs button, .lang button { padding: 5px 10px; border: 1px solid var(--line); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
    .tabs button[aria-pressed=true], .lang button[aria-pressed=true] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .cities { display: flex; gap: 4px; }
    .cities a { padding: 5px 10px; border: 1px solid var(--line); font-size: 11px; letter-spacing: .04em; text-decoration: none; color: inherit; }
    .cities a[aria-current=page] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .lang button[hidden] { display: none; }
    .back { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-decoration: none; text-transform: uppercase; }

    .wrap { flex: 1; min-height: 0; display: flex; }
    aside { width: 340px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); padding: 14px 16px 24px; }
    main { position: relative; flex: 1; min-width: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.drag { cursor: grabbing; }

    h1 { font-family: Oswald, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.05; margin: 0 0 6px; }
    .lead { color: var(--muted); line-height: 1.5; margin: 0 0 14px; }
    .total { font-family: Oswald, sans-serif; font-size: 15px; margin-bottom: 10px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
    .filters button { border: 1px solid var(--line); padding: 4px 8px; font-size: 11px; }
    .filters button[aria-pressed=true] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .group { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 14px 0 4px; }
    .cat { display: grid; grid-template-columns: 12px 1fr auto; gap: 2px 8px; align-items: center; width: 100%; text-align: left; padding: 5px 6px; margin: 0 -6px; border-radius: 3px; }
    a.cat { color: inherit; text-decoration: none; }
    .cat:hover { background: rgba(0,0,0,.04); }
    /* server-rendered panel for crawlers (replaced by the interactive one) */
    .seo-list { margin: 0 0 12px; padding-left: 20px; line-height: 1.7; }
    h2.group { font-weight: 400; }
    .cat[aria-pressed=true] { background: rgba(0,0,0,.07); }
    .cat i { width: 12px; height: 12px; border-radius: 2px; }
    .cat b { font-weight: 400; }
    .cat em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cat .bar { grid-column: 2 / 4; height: 3px; background: var(--base); }
    .cat .bar span { display: block; height: 100%; }
    .note { color: var(--faint); font-size: 11px; line-height: 1.5; margin-top: 18px; }

    .card { position: absolute; left: 16px; bottom: 16px; max-width: min(380px, calc(100% - 32px)); background: var(--paper);
      border: 1px solid var(--ink); padding: 12px 14px; box-shadow: 4px 4px 0 var(--ink); max-height: calc(100% - 32px); overflow-y: auto; }
    .card[hidden] { display: none; }
    .card .ka { font-family: 'Noto Sans Georgian', sans-serif; font-size: 12px; color: var(--muted); }
    .card .street { font-family: Oswald, sans-serif; font-size: 20px; line-height: 1.15; margin: 2px 0 6px; }
    .card .who { line-height: 1.5; }
    .tag { display: inline-block; padding: 1px 6px; margin: 6px 4px 0 0; font-size: 11px; color: #fff; }
    .card .x { position: absolute; top: 6px; right: 8px; font-size: 16px; color: var(--muted); }
    .hint { position: absolute; right: 16px; top: 12px; color: var(--faint); font-size: 11px; pointer-events: none; }
    .zoom { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 4px; }
    .zoom button { width: 32px; height: 32px; border: 1px solid var(--ink); background: var(--paper); font-size: 16px; }

    /* game */
    .game h2 { font-family: Oswald, sans-serif; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
    .q { font-family: Oswald, sans-serif; font-size: 26px; line-height: 1.1; margin: 0 0 4px; }
    .q-ka { font-family: 'Noto Sans Georgian', sans-serif; color: var(--muted); margin-bottom: 14px; }
    .opts { display: grid; gap: 6px; }
    .opts button { text-align: left; border: 1px solid var(--ink); padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
    .opts button i { width: 12px; height: 12px; border-radius: 2px; flex: none; }
    .opts button:not(:disabled):hover { background: rgba(0,0,0,.05); }
    .opts button.right { background: var(--ok); color: #fff; border-color: var(--ok); }
    .opts button.wrong { background: var(--bad); color: #fff; border-color: var(--bad); }
    .opts button:disabled { cursor: default; }
    .reveal { margin-top: 14px; line-height: 1.5; }
    .reveal b { font-family: Oswald, sans-serif; font-weight: 500; font-size: 16px; }
    .primary { margin-top: 14px; width: 100%; padding: 12px; background: var(--ink); color: var(--paper); text-transform: uppercase; letter-spacing: .1em; }
    .primary.ghost { background: none; color: var(--ink); border: 1px solid var(--ink); }
    .primary:disabled { opacity: .5; cursor: default; }
    .game input { display: block; width: 100%; margin: 6px 0 0; padding: 10px 12px; border: 1px solid var(--ink); background: #fff; font: inherit; }
    .top { list-style: none; margin: 0; padding: 0; }
    .top li { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
    .top li span { color: var(--faint); }
    .top li em { font-style: normal; font-family: Oswald, sans-serif; font-size: 16px; }
    .top li.me b { text-decoration: underline; }
    .score { display: flex; gap: 4px; margin: 0 0 14px; }
    .score i { flex: 1; height: 5px; background: var(--base); }
    .score i.ok { background: var(--ok); } .score i.no { background: var(--bad); }
    .big { font-family: Oswald, sans-serif; font-size: 64px; line-height: 1; margin: 6px 0; }
    .muted { color: var(--muted); }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .wrap { flex-direction: column; }
      main { flex: none; height: 58vh; order: -1; }
      aside { width: auto; border-right: 0; border-top: 1px solid var(--line); overflow: visible; }
      h1 { font-size: 24px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Чьи улицы Тбилиси<small id="sub">ვისი ქუჩებია</small></div>
    <div class="tabs" role="group">
      <button id="tab-map" aria-pressed="true">Карта</button>
      <button id="tab-game" aria-pressed="false">Угадайка</button>
    </div>
    <div class="lang" role="group">
      <button data-lang="ru" aria-pressed="true">RU</button>
      <button data-lang="en" aria-pressed="false">EN</button>
      <button data-lang="ka" aria-pressed="false">KA</button>
    </div>
    <nav class="cities"><a id="c-tbilisi" href="/lab/streets/">Тбилиси</a><a id="c-spb" href="/lab/streets/spb/">Петербург</a></nav>
    <span class="crumbs"><a class="back" id="back" href="/">dimazvali.com</a> <span class="back">/</span> <a class="back" id="allp" href="/lab/">все проекты</a></span>
  </header>
  <div class="wrap">
    <aside id="side"><!--SIDE--></aside>
    <main>
      <canvas id="map"></canvas>
      <div class="hint" id="hint"></div>
      <div class="zoom"><button id="zin" aria-label="+">+</button><button id="zout" aria-label="−">−</button></div>
      <div class="card" id="card" hidden></div>
    </main>
  </div>
  <!--VIEW-->
  <script src="/lab/streets/app.js?v=7"></script>
</body>
</html>
