  <style>
    :root { --paper: #f4f1ea; --ink: #15120f; --muted: #56514a; --faint: #9a948b; --line: #c8c3b8; --ok: #2f8f4e; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--paper); color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 13px;
      display: flex; flex-direction: column; height: 100dvh; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    header { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }
    .logo { font-family: Oswald, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .01em; margin-right: auto; }
    .logo small { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 8px; letter-spacing: .06em; }
    .seg { display: flex; gap: 4px; align-items: center; }
    .seg button { padding: 5px 10px; border: 1px solid var(--line); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
    .seg button[aria-pressed=true] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .back { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-decoration: none; text-transform: uppercase; }
    html[lang=ka] body, html[lang=ka] .logo, html[lang=ka] .card h2 { font-family: 'Noto Sans Georgian', sans-serif; }
    html[lang=ka] .seg button, html[lang=ka] .primary { text-transform: none; letter-spacing: 0; }

    main { position: relative; flex: 1; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
    .status { position: absolute; left: 16px; top: 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
    .status b { color: var(--ink); }
    .caption { position: absolute; left: 16px; bottom: 14px; font-size: 11px; color: var(--faint); pointer-events: none; max-width: 50%; }
    .caption[hidden] { display: none; }
    .tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; }
    .tools button { padding: 8px 12px; border: 1px solid var(--ink); background: var(--paper); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .tools button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
    html[lang=ka] .tools button { text-transform: none; letter-spacing: 0; }

    .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px));
      background: var(--paper); border: 1px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 16px 18px 18px; max-height: calc(100% - 32px); overflow-y: auto; }
    .card[hidden] { display: none; }
    .card h2 { font-family: Oswald, sans-serif; font-weight: 700; font-size: 30px; line-height: 1; margin: 0 0 8px; }
    .card .res { font-size: 14px; line-height: 1.5; }
    .card .about { color: var(--muted); line-height: 1.55; margin: 12px 0 0; font-size: 12px; }
    .card .greek { font-family: Georgia, serif; letter-spacing: .12em; color: var(--ink); white-space: nowrap; }
    .card .x { position: absolute; top: 6px; right: 10px; font-size: 20px; color: var(--muted); }
    .card .row { display: flex; gap: 8px; margin-top: 14px; }
    .primary { flex: 1; padding: 11px; background: var(--ink); color: var(--paper); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; }
    .primary.ghost { background: none; color: var(--ink); border: 1px solid var(--ink); }

    /* fact bubbles popping up when a stone goes home */
    .bubble { position: absolute; z-index: 5; width: min(310px, calc(100% - 24px)); background: var(--paper); border: 1px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink); padding: 10px 12px 12px; pointer-events: none; animation: pop .22s ease-out;
      transition: opacity .3s ease; --tx: 50%; }
    .bubble.out { opacity: 0; }
    .bubble .bh { display: flex; justify-content: space-between; gap: 10px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .bubble .bh b { font-weight: 400; color: var(--ink); }
    .bubble.news .bh span { color: #9a3d1c; }
    .bubble p { margin: 6px 0 0; font-family: Lora, serif; font-size: 15px; line-height: 1.45; }
    .bubble .say { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-family: Lora, serif; font-style: italic; font-size: 14px; line-height: 1.45; color: var(--muted); }
    .bubble .say small { display: block; margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-style: normal; font-size: 10px; letter-spacing: .04em; color: var(--faint); }
    html[lang=ka] .bubble .say { font-family: 'Noto Sans Georgian', sans-serif; font-style: normal; font-size: 13px; }
    .bubble::after { content: ''; position: absolute; left: var(--tx); width: 12px; height: 12px; background: var(--paper);
      border: solid var(--ink); transform: translateX(-50%) rotate(45deg); }
    .bubble.up::after { bottom: -7px; border-width: 0 1px 1px 0; }
    .bubble.down::after { top: -7px; border-width: 1px 0 0 1px; }
    html[lang=ka] .bubble p { font-family: 'Noto Sans Georgian', sans-serif; font-style: normal; font-size: 14px; }
    html[lang=ka] .bubble .bh { text-transform: none; letter-spacing: 0; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }

    @media (max-width: 600px) {
      .logo small { display: block; margin: 2px 0 0; }
      .caption { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><span id="t-title">Дионис и Ариадна</span><small id="t-sub">реставрация мозаики Дзалиси</small></div>
    <div class="seg" id="langs" role="group">
      <button data-lang="ru" aria-pressed="true">RU</button>
      <button data-lang="en" aria-pressed="false">EN</button>
      <button data-lang="ka" aria-pressed="false">KA</button>
    </div>
    <a class="back" href="/">dimazvali.com</a>
  </header>
  <main id="main">
    <canvas id="c"></canvas>
    <div class="status" id="status"></div>
    <div class="caption" id="caption"></div>
    <div class="tools">
      <button id="b1">О мозаике</button>
      <button id="b2">Случайный участок</button>
    </div>
    <div class="card" id="card" hidden></div>
  </main>
  <script src="facts.js?v=1"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
